# covenant_rule (3 rows). Evaluated on the recomputed lines of a question-driven
# re-forecast, per scenario, over the companies and months the request changes.
# Thresholds are data: a controller can change them without a deploy.
- table: fpa_governance.covenant_rule
  rule_code: GM_PCT_FLOOR
  description: Gross margin % of the changed slice stays at or above 30%
  metric: gross_margin_pct
  measure: LEVEL
  comparator: '>='
  threshold: 30
  scope: REQUEST
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.covenant_rule
  rule_code: REVENUE_DROP_LIMIT
  description: Services revenue of the changed slice falls no more than 5% below the current plan
  metric: services_revenue
  measure: CHANGE_PCT
  comparator: '>='
  threshold: -5
  scope: REQUEST
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.covenant_rule
  rule_code: DELIVERY_COST_CEILING
  description: Delivery cost of the changed slice rises no more than 3% above the current plan
  metric: delivery_cost
  measure: CHANGE_PCT
  comparator: '<='
  threshold: 3
  scope: REQUEST
  created_by: e2a112d82c994c3ea08f65f1b78b4056

