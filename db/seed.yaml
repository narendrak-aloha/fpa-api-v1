# Deterministic governance seed for the supplied cube manifest (data/out/cube_manifest.json).
# Each entry is one row; `table` names the target <schema>.<table>.
# Load with: python -m db.seed   (idempotent: existing rows are left unchanged)

# role: seeded by migration 025, not here. Roles are a fixed enumeration
# tied to FK constraints, not environment-specific data, and migrations run
# before this file loads (docker/entrypoint.sh) -- a role referenced here
# wouldn't exist yet when an earlier migration needed it. See 025's docstring.

# app_user (7 rows)
# api_token is hashed on load (sha256) and never stored; these are the
# development tokens the README lists. `password` is hashed on load (scrypt)
# for email sign-in. Replace both anywhere that is not a laptop.
# The superadmin comes first: it is the one who grants everyone else access.
