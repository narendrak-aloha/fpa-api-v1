# plan_driver (12 rows)
# model_code is resolved to planning_model.model_id when loading.
# Every reference resolves to another driver or a metric; PRIOR(x, n) reads x
# from an earlier period and is not a same-period dependency (see calc_order_dag).
- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: attrition
  driver_name: Annual attrition rate
  formula: '0.12'
  effective_from: 2026-01-01
  unit: ratio
  value_type: percentage
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: heads
  driver_name: Delivery heads
  formula: PRIOR(heads, 1) * (1 - attrition / 12)
  effective_from: 2026-01-01
  unit: people
  value_type: count
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: available_hours
  driver_name: Available delivery hours
  formula: heads * 160
  effective_from: 2026-01-01
  unit: hours
  value_type: count
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: utilisation
  driver_name: Delivery utilisation
  formula: '0.75'
  effective_from: 2026-01-01
  unit: ratio
  value_type: percentage
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: billable_hours
  driver_name: Billable hours
  formula: available_hours * utilisation
  effective_from: 2026-01-01
  unit: hours
  value_type: count
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: rate_increase
  driver_name: Annual bill rate increase
  formula: '0.03'
  effective_from: 2026-01-01
  unit: ratio
  value_type: percentage
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: bill_rate
  driver_name: Blended bill rate
  formula: PRIOR(bill_rate, 12) * (1 + rate_increase)
  effective_from: 2026-01-01
  unit: USD/hour
  value_type: currency
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: realisation_factor
  driver_name: Realisation factor
  formula: '0.92'
  effective_from: 2026-01-01
  unit: ratio
  value_type: percentage
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: realisation
  driver_name: Realised rate
  formula: bill_rate * realisation_factor
  effective_from: 2026-01-01
  unit: USD/hour
  value_type: currency
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: customers
  driver_name: Active customers
  formula: '900'
  effective_from: 2026-01-01
  unit: count
  value_type: count
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.plan_driver
  model_code: FPA-2026
  driver_code: attach_rate
  driver_name: Support attach rate
  formula: '0.40'
  effective_from: 2026-01-01
  unit: ratio
  value_type: percentage
  created_by: e2a112d82c994c3ea08f65f1b78b4056

- table: fpa_governance.plan_driver
