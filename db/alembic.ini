[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/..
# Run env.py for every `alembic revision`, so plain revisions are numbered too.
revision_environment = true
# 001_create_schema_and_access_control.py, 002_..., 003_...
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
timezone = UTC
path_separator = os
# Overridden by FPA_GOVERNANCE_DB_URL when set (see migrations/env.py).
sqlalchemy.url = postgresql+psycopg://postgres:fpa@localhost:5431/fpa

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = logging.StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
