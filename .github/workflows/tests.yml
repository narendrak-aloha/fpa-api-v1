name: Tests and workflow replay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.0"
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Unit, Temporal behavior, and committed-history replay
        run: uv run --frozen pytest -m 'not integration'
