[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpa-project"
version = "0.1.0"
description = "FinOps planning API: FastAPI service over a ClickHouse cube and Postgres governance store, with a Claude/Gemini agent team and durable Temporal re-forecast"
requires-python = ">=3.11"
# Everything the application needs at runtime. This is the single source of truth:
# uv.lock pins it exactly, and the container builds from the lock.
dependencies = [
    # web service
    "fastapi>=0.115",
    "uvicorn>=0.24",
    "pydantic>=2.0",
    # ClickHouse cube: query execution and the seed generator
    "clickhouse-connect>=1.8.0",
    "faker>=40.39.0",
    "numpy>=2.4.6",
    # Postgres governance store: models, migrations, YAML seed
    "alembic>=1.16",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyyaml>=6",
    # agent team and model providers
    "agno>=3.0",
    "google-genai>=2.0",      # provider: gemini
    "anthropic>=1.0",         # provider: claude-api
    "claude-agent-sdk>=0.2",  # provider: claude-code (also needs the local `claude` CLI)
    "packaging>=23.0",
    "python-json-logger>=4.2.0",
    "python-dotenv>=1.2.3",
    # durable recompute: workflow/activity runtime and the Commitment Service client
    "temporalio>=1.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
markers = ["integration: needs the docker stack (Postgres, ClickHouse, Temporal)"]

[tool.setuptools.packages.find]
where = ["src"]
